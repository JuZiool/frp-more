<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRP-More · 客户端管理</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-size='15' font-weight='700' font-family='sans-serif' fill='%23fff' text-anchor='middle'%3EF+%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --border: #e5e9f0;
    --text: #1c2430;
    --text2: #64748b;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --green: #16a34a;
    --red: #dc2626;
    --amber: #d97706;
    --gray: #94a3b8;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(16, 24, 40, .07), 0 1px 2px rgba(16, 24, 40, .04);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 15px;
  }
  .brand { min-width: 0; }
  .brand h1 { font-size: 17px; font-weight: 650; }
  .brand h1 .app-name { white-space: nowrap; }
  .brand p { font-size: 12px; color: var(--text2); }
  .badge {
    font-size: 11px; color: var(--text2);
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 10px; margin-left: 4px;
  }
  .spacer { flex: 1; }
  .header-actions { display: flex; gap: 10px; flex: none; }
  #refresh-hint { flex: none; }
  .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 5px; display: inline-block; }
  button { font-family: inherit; cursor: pointer; }
  .btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 8px; padding: 7px 14px; font-size: 13px; white-space: nowrap;
    transition: all .15s;
  }
  .btn:hover { border-color: #cbd5e1; background: #f8fafc; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.danger-text { color: var(--red); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 28px 60px; }

  #log-view {
    min-height: 300px; max-height: 52vh; overflow: auto;
    background: #0f172a; color: #cbd5e1;
    font-family: ui-monospace, Consolas, "Courier New", monospace;
    font-size: 12px; line-height: 1.55;
    padding: 12px 14px; border-radius: 8px;
    white-space: pre-wrap; word-break: break-all;
  }
  .log-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .log-toolbar input[type=text] {
    flex: 1 1 180px; min-width: 160px; border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 12px; font-size: 13px; font-family: ui-monospace, Consolas, monospace;
  }
  /* 用专用类避免被 .modal-body label 的 display:block 覆盖 */
  .log-toolbar .log-follow {
    display: flex; align-items: center; gap: 5px; flex: none;
    font-size: 12.5px; color: var(--text2); white-space: nowrap; cursor: pointer;
    margin-bottom: 0; font-weight: normal;
  }
  .modal-body label.check-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 13.5px; cursor: pointer; margin-bottom: 0; font-weight: normal;
  }
  .log-meta { font-size: 12px; color: var(--text2); flex: none; white-space: nowrap; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 12px;
  }
  .card-head { display: flex; align-items: center; gap: 8px; }
  .state-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .state-dot.running { background: var(--green); box-shadow: 0 0 0 3px rgba(22, 163, 74, .15); }
  .state-dot.stopped { background: var(--gray); }
  .state-dot.exited { background: var(--red); box-shadow: 0 0 0 3px rgba(220, 38, 38, .12); }
  .inst-name { font-weight: 650; font-size: 15px; word-break: break-all; }
  .state-label { font-size: 12px; padding: 1px 8px; border-radius: 999px; }
  .state-label.running { color: var(--green); background: rgba(22,163,74,.1); }
  .state-label.stopped { color: var(--text2); background: #f1f5f9; }
  .state-label.exited { color: var(--red); background: rgba(220,38,38,.08); }
  .meta { color: var(--text2); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 14px; word-break: break-all; }
  .meta code { background: var(--bg); padding: 1px 6px; border-radius: 5px; font-size: 12px; }
  .err-line {
    font-size: 12px; color: var(--red); background: rgba(220,38,38,.06);
    border: 1px solid rgba(220,38,38,.15); border-radius: 8px; padding: 7px 10px;
    word-break: break-all;
  }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; color: var(--text2); font-weight: 500; padding: 4px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 5px 6px; border-bottom: 1px dashed #eef2f7; }
  .proxy-name {
    display: inline-block; max-width: 148px; vertical-align: bottom;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: ui-monospace, Consolas, monospace; font-size: 12px;
  }
  tr:last-child td { border-bottom: none; }
  .phase { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  .phase.running { color: var(--green); background: rgba(22,163,74,.1); }
  .phase.error { color: var(--red); background: rgba(220,38,38,.08); }
  .phase.warn { color: var(--amber); background: rgba(217,119,6,.1); }
  .phase.gray { color: var(--text2); background: #f1f5f9; }
  .addr { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .card-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; flex-wrap: wrap; }
  .card-actions .btn { padding: 5px 10px; font-size: 12.5px; }

  .empty {
    border: 2px dashed #d3dae5; border-radius: var(--radius); padding: 70px 20px;
    text-align: center; color: var(--text2); background: rgba(255,255,255,.5);
  }
  .empty .big { font-size: 40px; margin-bottom: 10px; }

  .modal-mask {
    position: fixed; inset: 0; background: rgba(15, 23, 42, .45);
    display: none; align-items: flex-start; justify-content: center;
    padding: 6vh 16px; z-index: 100;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--card); border-radius: 14px; width: 680px; max-width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,.25); display: flex; flex-direction: column;
    max-height: 88vh;
  }
  .modal-head { padding: 16px 22px; border-bottom: 1px solid var(--border); font-weight: 650; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
  .modal-close { border: none; background: none; font-size: 20px; color: var(--text2); line-height: 1; }
  .modal-body { padding: 18px 22px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
  .modal-body label { font-size: 13px; font-weight: 500; display: block; margin-bottom: 5px; }
  .modal-body input, .modal-body select {
    width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px;
    font-size: 14px; font-family: inherit; background: var(--card); color: var(--text);
  }
  .modal-body input[type=checkbox] { width: auto; padding: 0; margin: 0; }
  .modal-body input:focus, textarea:focus { outline: 2px solid rgba(37,99,235,.25); border-color: var(--accent); }
  .hint { font-size: 12px; color: var(--text2); }
  textarea {
    width: 100%; min-height: 300px; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; font-family: ui-monospace, Consolas, "Courier New", monospace;
    font-size: 12.5px; line-height: 1.6; resize: vertical; color: var(--text);
  }
  .modal-foot { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

  /* 新建实例：表单 / TOML 两种录入方式 */
  .seg { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 3px; width: fit-content; }
  .seg button {
    border: none; background: none; color: var(--text2); font-family: inherit;
    font-size: 13px; padding: 5px 16px; border-radius: 6px; white-space: nowrap;
  }
  .seg button.active { background: var(--card); color: var(--text); font-weight: 550; box-shadow: var(--shadow); }
  #form-mode { display: flex; flex-direction: column; gap: 12px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-grid label { display: block; font-size: 12.5px; font-weight: 500; margin-bottom: 5px; }
  .proxy-box { border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .proxy-box-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .proxy-box-head b { font-size: 13px; }
  .proxy-box-head .btn { padding: 3px 9px; font-size: 12px; }
  .row-del { border: none; background: none; color: var(--red); font-size: 12.5px; padding: 3px 6px; flex: none; }


  .login-mask {
    position: fixed; inset: 0; background: rgba(15, 23, 42, .45);
    display: none; align-items: center; justify-content: center;
    padding: 20px; z-index: 300;
  }
  .login-mask.show { display: flex; }
  .login-card {
    width: 380px; max-width: 100%; background: var(--card); border-radius: 14px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25); padding: 28px;
  }
  .login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .login-brand h2 { font-size: 20px; }
  .login-brand p { color: var(--text2); font-size: 12px; margin-top: 2px; }
  .login-card label { display: block; font-size: 13px; font-weight: 500; margin: 12px 0 5px; }
  .login-card input {
    width: 100%; border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 12px; font-size: 14px; font-family: inherit;
  }
  .login-card input:focus { outline: 2px solid rgba(37,99,235,.25); border-color: var(--accent); }
  .login-card .btn { width: 100%; margin-top: 18px; padding: 9px 14px; }
  .login-error { min-height: 18px; color: var(--red); font-size: 12px; margin-top: 10px; }

  #toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
  .toast {
    background: #1e293b; color: #fff; border-radius: 8px; padding: 10px 16px;
    font-size: 13px; box-shadow: 0 4px 12px rgba(0,0,0,.2); max-width: 420px;
    animation: slide-in .2s ease; word-break: break-all;
  }
  .toast.error { background: var(--red); }
  .toast.success { background: var(--green); }
  @keyframes slide-in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* 窄屏：头部允许换行，操作按钮整行铺开，避免被挤压成竖排文字 */
  @media (max-width: 640px) {
    header { flex-wrap: wrap; padding: 12px 16px; row-gap: 10px; }
    .brand { flex: 1 1 auto; }
    .brand h1 { font-size: 16px; }
    .header-actions { flex: 1 1 100%; order: 10; }
    .header-actions .btn { flex: 1; padding: 8px 10px; }
    main { padding: 16px 16px 60px; }
    .card { padding: 14px; }
    .toast { max-width: calc(100vw - 40px); }
    .form-grid { grid-template-columns: 1fr; }
    .modal-body { padding: 16px 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">F+</div>
  <div class="brand">
    <h1><span class="app-name">FRP-More</span> <span class="badge" id="version-badge">…</span></h1>
    <p>FRP 客户端可视化管理 · 单容器多实例</p>
  </div>
  <div class="spacer"></div>
  <span class="hint" id="refresh-hint"><span class="conn-dot"></span>自动刷新中</span>
  <div class="header-actions">
    <button class="btn" id="btn-logs">日志</button>
    <button class="btn" id="btn-rescan">扫描目录</button>
    <button class="btn primary" id="btn-new">＋ 新建实例</button>
    <button class="btn" id="btn-logout">退出登录</button>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    <div class="big">📦</div>
    <p><b>还没有任何实例</b></p>
    <p>点击右上角「新建实例」创建第一个 frpc 配置，或将 .toml 配置文件放入数据目录后点击「扫描目录」。</p>
  </div>
</main>

<div class="modal-mask" id="modal-mask">
  <div class="modal">
    <div class="modal-head">
      <span id="modal-title">新建实例</span>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="seg" id="mode-seg">
        <button type="button" id="mode-form">表单</button>
        <button type="button" id="mode-toml">TOML</button>
      </div>
      <div id="name-field">
        <label>实例名称</label>
        <input id="inst-name" placeholder="例如：家里的小狗" maxlength="64">
        <div class="hint">支持中文、字母、数字、空格及 . _ -，最长 64 字符；将作为配置文件名保存，可随时重命名。</div>
      </div>

      <div id="form-mode">
        <div class="form-grid">
          <div>
            <label for="f-server">服务端地址 *</label>
            <input id="f-server" placeholder="frps 地址，如 1.2.3.4">
          </div>
          <div>
            <label for="f-port">服务端端口 *</label>
            <input id="f-port" inputmode="numeric" value="7000">
          </div>
          <div class="full">
            <label for="f-token">认证 Token（可选）</label>
            <input id="f-token" placeholder="与服务端 auth.token 一致，留空表示不启用">
          </div>
          <div class="full">
            <label class="check-row"><input type="checkbox" id="f-retry" checked> 连接失败后保持重试（loginFailExit = false）</label>
          </div>
        </div>
        <div>
          <label>代理</label>
          <div id="proxy-rows" style="display:flex;flex-direction:column;gap:10px"></div>
          <button type="button" class="btn" id="add-proxy" style="margin-top:10px">＋ 添加代理</button>
        </div>
        <div class="hint">需要 TLS / transport / 访问器等高级配置时，请切到「TOML」模式。</div>
      </div>

      <div id="toml-mode">
        <label>frpc 配置（TOML）</label>
        <textarea id="inst-config" spellcheck="false"></textarea>
        <div class="hint">保存时会做完整校验；若实例正在运行，保存后自动重启生效。配置项参考
          <a href="https://github.com/fatedier/frp/blob/dev/README_zh.md#%E9%85%8D%E7%BD%AE%E6%96%87%E4%BB%B6" target="_blank">frp 官方文档</a>。</div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="modal-cancel">取消</button>
      <button class="btn primary" id="modal-save">保存</button>
    </div>
  </div>
</div>

<template id="proxy-tpl">
  <div class="proxy-box">
    <div class="proxy-box-head">
      <b>代理</b>
      <button type="button" class="row-del" title="删除此代理">删除</button>
    </div>
    <div class="form-grid">
      <div>
        <label>代理名称 *</label>
        <input class="f-name" placeholder="如 web">
      </div>
      <div>
        <label>类型</label>
        <select class="f-type">
          <option>tcp</option><option>udp</option><option>http</option><option>https</option>
          <option>stcp</option><option>sudp</option><option>xtcp</option><option>tcpmux</option>
        </select>
      </div>
      <div>
        <label>本地地址</label>
        <input class="f-localIP" value="127.0.0.1">
      </div>
      <div>
        <label>本地端口 *</label>
        <input class="f-localPort" inputmode="numeric" placeholder="如 8080">
      </div>
      <div class="w-remotePort">
        <label>远程端口 *</label>
        <input class="f-remotePort" inputmode="numeric" placeholder="如 6001">
      </div>
      <div class="w-customDomains">
        <label>自定义域名</label>
        <input class="f-customDomains" placeholder="多个用逗号分隔">
      </div>
      <div class="w-subdomain">
        <label>子域名</label>
        <input class="f-subdomain">
      </div>
      <div class="w-secretKey">
        <label>密钥</label>
        <input class="f-secretKey" placeholder="stcp/sudp/xtcp 密钥">
      </div>
    </div>
  </div>
</template>

<div class="modal-mask" id="log-mask">
  <div class="modal">
    <div class="modal-head">
      <span id="log-title">实时日志</span>
      <button class="modal-close" id="log-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="log-toolbar">
        <input type="text" id="log-filter" placeholder="筛选关键字，例如实例名 / 代理名 / runID…">
        <label class="log-follow"><input type="checkbox" id="log-follow" checked> 自动刷新</label>
        <span class="log-meta" id="log-meta"></span>
      </div>
      <div id="log-view"></div>
    </div>
  </div>
</div>


<div class="login-mask show" id="login-mask">
  <div class="login-card" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <div class="login-brand">
      <div class="logo">F+</div>
      <div>
        <h2 id="login-title">FRP-More</h2>
        <p>登录管理面板</p>
      </div>
    </div>
    <form id="login-form">
      <label for="login-username">用户名</label>
      <input id="login-username" autocomplete="username" value="admin" required>
      <label for="login-password">密码</label>
      <input id="login-password" type="password" autocomplete="current-password" required>
      <div class="login-error" id="login-error" role="alert"></div>
      <button class="btn primary" id="login-submit" type="submit">登录</button>
    </form>
  </div>
</div>

<div id="toasts"></div>

<script>
const TEMPLATE = `# frpc 实例配置（TOML 格式）
serverAddr = "127.0.0.1"
serverPort = 7000

# 连接失败后保持重试，便于服务恢复后自动重连（推荐保留）
loginFailExit = false

[[proxies]]
name = "web"
type = "tcp"
localIP = "127.0.0.1"
localPort = 8080
remotePort = 6001
`;

const PHASE_LABELS = {
  'running':       { t: '运行中',     c: 'running' },
  'start error':   { t: '启动失败',   c: 'error' },
  'check failed':  { t: '检查失败',   c: 'error' },
  'wait start':    { t: '等待启动',   c: 'warn' },
  'new':           { t: '初始化',     c: 'gray' },
  'not connected': { t: '未连接',     c: 'gray' },
  'stopped':       { t: '已停止',     c: 'gray' },
};
const STATE_LABELS = {
  'running': '运行中',
  'stopped': '已停止',
  'exited': '已退出',
};

let instances = [];
let editingName = null;   // null = create mode
let refreshTimer = null;
let loggedIn = false;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));

function showLogin(message = '') {
  loggedIn = false;
  clearInterval(refreshTimer);
  refreshTimer = null;
  $('login-error').textContent = message;
  $('login-mask').classList.add('show');
  setTimeout(() => $('login-username').focus(), 0);
}

function hideLogin() {
  loggedIn = true;
  $('login-error').textContent = '';
  $('login-mask').classList.remove('show');
}

function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    cache: 'no-store',
    ...opts,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || ('HTTP ' + res.status));
    err.status = res.status;
    if (res.status === 401 && path !== '/api/login' && path !== '/api/session') showLogin();
    throw err;
  }
  return data;
}

function uptime(iso) {
  if (!iso) return '';
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return '已运行 ' + s + ' 秒';
  if (s < 3600) return '已运行 ' + Math.floor(s / 60) + ' 分 ' + (s % 60) + ' 秒';
  if (s < 86400) return '已运行 ' + Math.floor(s / 3600) + ' 小时 ' + Math.floor(s % 3600 / 60) + ' 分';
  return '已运行 ' + Math.floor(s / 86400) + ' 天';
}

function phaseBadge(p) {
  const info = PHASE_LABELS[p] || { t: p, c: 'gray' };
  return `<span class="phase ${info.c}">${esc(info.t)}</span>`;
}

function render() {
  const total = instances.length;
  $('empty').style.display = total ? 'none' : 'block';

  $('grid').innerHTML = instances.map(i => {
    const stateCls = i.state === 'running' ? 'running' : (i.state === 'exited' ? 'exited' : 'stopped');
    const canStart = i.state !== 'running';
    const proxies = (i.proxies || []).map(p => `
      <tr>
        <td><span class="proxy-name" title="${esc(p.name)}">${esc(p.name)}</span></td>
        <td>${esc(p.type)}</td>
        <td>${phaseBadge(p.phase)}</td>
        <td class="addr">${esc(String(p.remoteAddr || '-').replace(/^:/, ''))}</td>
      </tr>`).join('');
    const proxyTable = (i.proxies || []).length ? `
      <table>
        <thead><tr><th>代理</th><th>类型</th><th>状态</th><th>远程端口</th></tr></thead>
        <tbody>${proxies}</tbody>
      </table>` : '<div class="hint">此实例未配置代理</div>';
    const visitors = (i.visitors && i.visitors.length) ? `
      <div class="meta">访问器：${i.visitors.map(v => esc(v.name) + ' (' + esc(v.type) + ')').join('、')}</div>` : '';
    return `
    <div class="card">
      <div class="card-head">
        <span class="state-dot ${stateCls}"></span>
        <span class="inst-name">${esc(i.name)}</span>
        <span class="state-label ${stateCls}">${STATE_LABELS[i.state] || i.state}</span>
      </div>
      <div class="meta">
        ${i.startedAt ? `<span class="uptime" data-started="${esc(i.startedAt)}">${uptime(i.startedAt)}</span>` : ''}
        <span>代理 <b>${i.proxyOnline || 0}</b>/${(i.proxies || []).length} 在线</span>
      </div>
      ${i.lastErr ? `<div class="err-line">${esc(i.lastErr)}</div>` : ''}
      ${proxyTable}
      ${visitors}
      <div class="card-actions">
        ${canStart
          ? `<button class="btn" title="启动实例" onclick="act('start','${esc(i.name)}')">启动</button>`
          : `<button class="btn" title="停止实例" onclick="act('stop','${esc(i.name)}')">停止</button>
             <button class="btn" title="重启实例" onclick="act('restart','${esc(i.name)}')">重启</button>`}
        <button class="btn" title="查看日志" onclick="openLogs('', '${esc(i.name)}')">日志</button>
        <button class="btn" title="编辑配置" onclick="openEdit('${esc(i.name)}')">编辑</button>
        <button class="btn danger-text" title="删除实例" onclick="del('${esc(i.name)}')">删除</button>
      </div>
    </div>`;
  }).join('');
}

async function refresh(silent = true) {
  try {
    instances = await api('/api/instances');
    render();
    if (!silent) toast('已刷新', 'success');
  } catch (e) {
    if (!silent) toast('刷新失败：' + e.message, 'error');
    $('refresh-hint').innerHTML = '<span class="conn-dot" style="background:var(--red)"></span>连接断开，重试中…';
    return;
  }
  $('refresh-hint').innerHTML = '<span class="conn-dot"></span>自动刷新中';
}

async function act(action, name) {
  try {
    await api(`/api/instances/${encodeURIComponent(name)}/${action}`, { method: 'POST' });
    toast(`实例 ${name} ${ {start:'已启动', stop:'已停止', restart:'已重启'}[action] }`, 'success');
  } catch (e) {
    toast(`操作失败：${e.message}`, 'error');
  }
  await refresh();
}

async function del(name) {
  if (!confirm(`确定删除实例「${name}」吗？\n配置文件将从数据目录中移除，此操作不可恢复。`)) return;
  try {
    await api(`/api/instances/${encodeURIComponent(name)}`, { method: 'DELETE' });
    toast(`实例 ${name} 已删除`, 'success');
  } catch (e) {
    toast(`删除失败：${e.message}`, 'error');
  }
  await refresh();
}

// ---------- 表单 → TOML ----------
// 生成逻辑是纯函数，不碰 DOM；tools/check-form.js 会提取下面这一段做自测。
// ==== form-toml:start ====
const tomlStr = (s) => '"' + String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';

function portNum(v) {
  return /^\d+$/.test(String(v)) && +v >= 1 && +v <= 65535 ? +v : 0;
}

// 各类型代理需要额外填写的字段
const PROXY_EXTRA = {
  tcp: ['remotePort'], udp: ['remotePort'], tcpmux: ['remotePort'],
  http: ['customDomains', 'subdomain'], https: ['customDomains', 'subdomain'],
  stcp: ['secretKey'], sudp: ['secretKey'], xtcp: ['secretKey'],
};
const PROXY_OPTIONAL = ['remotePort', 'customDomains', 'subdomain', 'secretKey'];

// f = {serverAddr, serverPort, token, retry, proxies:[{name,type,localIP,localPort,...}]}
// 不合法时抛错，错误信息直接展示给用户。
function tomlFromForm(f) {
  const serverAddr = String(f.serverAddr || '').trim();
  if (!serverAddr) throw new Error('请填写服务端地址');
  const serverPort = portNum(f.serverPort);
  if (!serverPort) throw new Error('服务端端口需为 1-65535');

  const proxies = f.proxies || [];
  if (!proxies.length) throw new Error('请至少添加一个代理');

  let out = `serverAddr = ${tomlStr(serverAddr)}\nserverPort = ${serverPort}\n`;
  const token = String(f.token || '').trim();
  if (token) out += `auth.token = ${tomlStr(token)}\n`;
  if (f.retry) out += 'loginFailExit = false\n';

  const seen = new Set();
  for (const p of proxies) {
    const type = p.type || 'tcp';
    const name = String(p.name || '').trim();
    if (!name) throw new Error('代理名称不能为空');
    if (seen.has(name)) throw new Error(`代理名称重复：${name}`);
    seen.add(name);
    const localPort = portNum(p.localPort);
    if (!localPort) throw new Error(`代理「${name}」的本地端口需为 1-65535`);

    out += `\n[[proxies]]\nname = ${tomlStr(name)}\ntype = ${tomlStr(type)}\n`;
    const localIP = String(p.localIP || '').trim();
    if (localIP) out += `localIP = ${tomlStr(localIP)}\n`;
    out += `localPort = ${localPort}\n`;

    const extra = PROXY_EXTRA[type] || [];
    if (extra.includes('remotePort')) {
      const remotePort = portNum(p.remotePort);
      if (!remotePort) throw new Error(`代理「${name}」的远程端口需为 1-65535`);
      out += `remotePort = ${remotePort}\n`;
    }
    if (extra.includes('customDomains')) {
      const domains = String(p.customDomains || '').split(',').map(s => s.trim()).filter(Boolean);
      if (domains.length) out += `customDomains = [${domains.map(tomlStr).join(', ')}]\n`;
      const subdomain = String(p.subdomain || '').trim();
      if (subdomain) out += `subdomain = ${tomlStr(subdomain)}\n`;
    }
    if (extra.includes('secretKey')) {
      const secretKey = String(p.secretKey || '').trim();
      if (secretKey) out += `secretKey = ${tomlStr(secretKey)}\n`;
    }
  }
  return out;
}
// ==== form-toml:end ====

let modalMode = 'toml';   // 编辑已有实例只用 TOML
let formDirty = false;    // 表单是否被改过（决定切到 TOML 时是否覆盖）
let tomlDirty = false;    // TOML 是否被手改过

function addProxyRow(data = {}) {
  const box = $('proxy-tpl').content.firstElementChild.cloneNode(true);
  for (const k of ['name', 'localIP', 'localPort', 'remotePort', 'customDomains', 'subdomain', 'secretKey']) {
    if (data[k] !== undefined) box.querySelector('.f-' + k).value = data[k];
  }
  box.querySelector('.f-type').value = data.type || 'tcp';
  box.querySelector('.f-type').onchange = () => syncProxyFields(box);
  box.querySelector('.row-del').onclick = () => { box.remove(); renumberProxies(); formDirty = true; };
  $('proxy-rows').appendChild(box);
  syncProxyFields(box);
  renumberProxies();
}

// 多代理时用序号区分每个框，避免都叫「代理」
function renumberProxies() {
  [...$('proxy-rows').children].forEach((box, i) => {
    box.querySelector('.proxy-box-head b').textContent = '代理 ' + (i + 1);
  });
}

function syncProxyFields(box) {
  const show = PROXY_EXTRA[box.querySelector('.f-type').value] || [];
  for (const f of PROXY_OPTIONAL) {
    box.querySelector('.w-' + f).style.display = show.includes(f) ? '' : 'none';
  }
}

function readForm() {
  const value = (el) => el.value;
  return {
    serverAddr: value($('f-server')),
    serverPort: value($('f-port')),
    token: value($('f-token')),
    retry: $('f-retry').checked,
    proxies: [...$('proxy-rows').children].map(box => {
      const proxy = { type: box.querySelector('.f-type').value };
      for (const k of ['name', 'localIP', 'localPort', 'remotePort', 'customDomains', 'subdomain', 'secretKey']) {
        proxy[k] = value(box.querySelector('.f-' + k));
      }
      return proxy;
    }),
  };
}

function buildToml() { return tomlFromForm(readForm()); }

function renderMode() {
  const form = modalMode === 'form';
  $('mode-form').classList.toggle('active', form);
  $('mode-toml').classList.toggle('active', !form);
  $('form-mode').style.display = form ? '' : 'none';
  $('toml-mode').style.display = form ? 'none' : '';
}

function setMode(mode) {
  if (mode === modalMode) return;
  if (mode === 'toml') {
    // 表单未被改动（如刚打开就切走）时保留原有 TOML，不覆盖
    if (!formDirty) { modalMode = mode; renderMode(); return; }
    // 表单有内容才重新生成；生成失败就留在表单模式并提示缺什么
    try {
      $('inst-config').value = buildToml();
      tomlDirty = false;
    } catch (e) {
      toast('表单未填写完整：' + e.message, 'error');
      return;
    }
  } else if (tomlDirty) {
    if (!confirm('切回表单后保存将按表单字段重新生成配置，TOML 中手动添加的内容会丢失。继续？')) return;
    tomlDirty = false;
  }
  modalMode = mode;
  renderMode();
}

function openModal(title, { name = '', config = TEMPLATE, mode = 'toml' } = {}) {
  $('modal-title').textContent = title;
  $('inst-name').value = name;
  $('inst-config').value = config;
  $('f-server').value = '';
  $('f-port').value = '7000';
  $('f-token').value = '';
  $('f-retry').checked = true;
  $('proxy-rows').textContent = '';
  modalMode = mode;
  formDirty = false;
  tomlDirty = false;
  // 表单模式只在新建时出现：编辑已有配置时按字段重建会丢掉高级配置项
  $('mode-seg').style.display = mode === 'form' ? '' : 'none';
  if (mode === 'form') addProxyRow();
  renderMode();
  $('modal-mask').classList.add('show');
  if (!name) $('inst-name').focus();
}

function closeModal() { $('modal-mask').classList.remove('show'); }

async function openEdit(name) {
  try {
    const data = await api(`/api/instances/${encodeURIComponent(name)}/config`);
    editingName = name; // 标记编辑模式，save() 才会走更新而不是创建
    openModal('编辑实例：' + name, { name, config: data.config });
  } catch (e) {
    toast('读取配置失败：' + e.message, 'error');
  }
}

async function save() {
  const name = $('inst-name').value.trim();
  if (!name) { toast('请填写实例名称', 'error'); return; }
  let config;
  if (!editingName && modalMode === 'form') {
    try {
      config = buildToml();
    } catch (e) {
      toast(e.message, 'error');
      return;
    }
  } else {
    config = $('inst-config').value;
  }
  try {
    if (editingName) {
      const renamed = name !== editingName;
      await api(`/api/instances/${encodeURIComponent(editingName)}/config`, {
        method: 'PUT', body: JSON.stringify({ name, config }),
      });
      toast(renamed ? `已保存并重命名为「${name}」` : '配置已保存并应用', 'success');
    } else {
      await api('/api/instances', {
        method: 'POST', body: JSON.stringify({ name, config }),
      });
      toast(`实例 ${name} 已创建并启动`, 'success');
    }
    closeModal();
  } catch (e) {
    toast('保存失败：' + e.message, 'error');
  }
  await refresh();
}

$('login-form').onsubmit = async (e) => {
  e.preventDefault();
  const btn = $('login-submit');
  btn.disabled = true;
  $('login-error').textContent = '';
  try {
    await api('/api/login', {
      method: 'POST',
      body: JSON.stringify({
        username: $('login-username').value.trim(),
        password: $('login-password').value,
      }),
    });
    hideLogin();
    await initApp();
  } catch (e) {
    $('login-error').textContent = e.status === 401 ? '用户名或密码错误' : '登录失败：' + e.message;
    $('login-password').focus();
  } finally {
    btn.disabled = false;
  }
};

$('btn-logout').onclick = async () => {
  try { await api('/api/logout', { method: 'POST' }); } catch (e) { /* session may already be expired */ }
  showLogin('已退出登录');
};

$('btn-new').onclick = () => { editingName = null; openModal('新建实例', { mode: 'form' }); };
$('mode-form').onclick = () => setMode('form');
$('mode-toml').onclick = () => setMode('toml');
$('add-proxy').onclick = () => addProxyRow();
$('form-mode').oninput = () => { formDirty = true; };
$('inst-config').oninput = () => { tomlDirty = true; };
$('btn-rescan').onclick = async () => {
  try {
    instances = await api('/api/reload-dir', { method: 'POST' });
    render();
    toast('目录扫描完成', 'success');
  } catch (e) { toast('扫描失败：' + e.message, 'error'); }
};
$('modal-close').onclick = closeModal;
$('modal-cancel').onclick = closeModal;
$('modal-save').onclick = save;
$('modal-mask').onclick = (e) => { if (e.target === $('modal-mask')) closeModal(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeModal(); closeLogs(); } });

// ---------- 日志查看 ----------
let logTimer = null;
let logLines = [];
let logInstance = '';

function renderLogs(dropped) {
  const kw = $('log-filter').value.trim().toLowerCase();
  const shown = kw ? logLines.filter(l => l.toLowerCase().includes(kw)) : logLines;
  const view = $('log-view');
  const atBottom = view.scrollTop + view.clientHeight >= view.scrollHeight - 30;
  view.textContent = shown.join('\n') || (kw ? '（无匹配日志）' : '（暂无日志）');
  $('log-meta').textContent =
    `显示 ${shown.length} / 共 ${logLines.length} 行` + (dropped ? ` · 已丢弃更早 ${dropped} 行` : '');
  if (atBottom) view.scrollTop = view.scrollHeight;
}

async function refreshLogs() {
  try {
    const path = logInstance ? `/api/instances/${encodeURIComponent(logInstance)}/logs` : '/api/logs';
    const data = await api(path);
    logLines = data.lines || [];
    renderLogs(data.dropped || 0);
  } catch (e) {
    // Do not leave the previous global/other-instance lines on screen when
    // loading a selected instance log fails.
    logLines = [];
    renderLogs(0);
    $('log-view').textContent = '日志加载失败：' + e.message;
    $('log-meta').textContent = '加载失败';
  }
}

function openLogs(filter = '', instance = '') {
  logInstance = instance;
  $('log-filter').value = filter;
  $('log-title').textContent = instance ? `实例日志：${instance}` : '全局日志';
  $('log-mask').classList.add('show');
  refreshLogs();
  clearInterval(logTimer);
  logTimer = setInterval(() => {
    if ($('log-follow').checked) refreshLogs();
  }, 2000);
}

function closeLogs() {
  $('log-mask').classList.remove('show');
  $('log-title').textContent = '全局日志';
  logInstance = '';
  clearInterval(logTimer);
  logTimer = null;
}

$('btn-logs').onclick = () => openLogs('');

$('log-close').onclick = closeLogs;
$('log-filter').oninput = renderLogs;
$('log-mask').onclick = (e) => { if (e.target === $('log-mask')) closeLogs(); };

// 时长本地每秒跳动，不依赖接口轮询
setInterval(() => {
  document.querySelectorAll('.uptime').forEach(el => {
    if (el.dataset.started) el.textContent = uptime(el.dataset.started);
  });
}, 1000);

async function initApp() {
  const v = await api('/api/version');
  $('version-badge').textContent = 'v' + v.appVersion + ' · frp ' + v.frpVersion;
  await refresh();
  clearInterval(refreshTimer);
  refreshTimer = setInterval(() => { if (loggedIn) refresh(true); }, 4000);
}

(async function init() {
  try {
    await api('/api/session');
    hideLogin();
    await initApp();
  } catch (e) {
    if (e.status !== 401) showLogin('无法连接到服务：' + e.message);
  }
})();
</script>
